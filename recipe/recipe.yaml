schema_version: 1

context:
  version: "2026.11.0"

package:
  name: python-graphblas
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/python-graphblas/python_graphblas-${{ version }}.tar.gz
  sha256: 986a81a594f3ed118ab74aba5ea0658910c8e427c80fe514179cbc5612dcc85b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77
    - setuptools-git-versioning
    - pip
  run:
    - python >=${{ python_min }}
    - python-suitesparse-graphblas >=7.4.0.0
    - numpy >=1.24
    - numba >=0.57
    - donfig >=0.6
    - pyyaml >=5.4

tests:
  - python:
      imports:
        - graphblas
        - graphblas.agg
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - python -c "from graphblas import Matrix"

about:
  homepage: https://github.com/python-graphblas/python-graphblas
  repository: https://github.com/python-graphblas/python-graphblas
  documentation: https://python-graphblas.readthedocs.io
  license: Apache-2.0
  license_file: LICENSE
  summary: 'Python library for GraphBLAS: high-performance sparse linear algebra for scalable graph analytics'
  description: |
    Python wrapper around GraphBLAS. Currently only supports SuiteSparse::GraphBLAS.
    Goal is to be a Pythonic way to write beautiful, efficient graph algorithms
    in the language of linear algebra.

extra:
  recipe-maintainers:
    - eriknw
    - jim22k
